<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Buster Cineplex</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #0a0a0a; 
            color: white; 
            font-family: Arial, sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        
        header { 
            background: #1a1a1a; 
            padding: 15px 30px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 6px solid #e50914; 
        }
        .cinema-name { 
            font-size: 2.6rem; 
            font-weight: bold; 
            color: #e50914; 
            letter-spacing: 2px;
        }

        .live-clock-container {
            text-align: right;
        }
        .live-time {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
        }
        .live-date {
            font-size: 1.2rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .main { 
            display: flex; 
            flex: 1; 
            height: calc(100vh - 95px); 
        }
        
        /* இடது பக்கம்: Logo பகுதி */
        .poster-panel {
            flex: 1;
            background-color: #000; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .poster-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* வலது பக்கம்: தகவல்கள் / வீடியோ பகுதி */
        .info-panel { 
            flex: 1; 
            background: #1a1a1a; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 40px;
            box-sizing: border-box;
            border-left: 2px solid #333;
            position: relative;
            overflow: hidden;
        }

        /* Video Player ஸ்டைல் */
        .video-container {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Now Seating வடிவமைப்பு */
        .now-seating { 
            animation: flicker 0.7s infinite alternate; 
            background: #e50914; 
            padding: 25px 60px; 
            font-size: 3rem; 
            font-weight: bold; 
            border-radius: 12px; 
            margin-bottom: 30px; 
            display: none; 
            z-index: 2;
        }
        @keyframes flicker { 
            from { opacity: 1; } 
            to { opacity: 0.5; } 
        }
        
        .hall-container { 
            display: none; 
            flex-direction: column; 
            gap: 20px; 
            width: 100%; 
            align-items: center; 
            z-index: 2;
        }
        .hall { 
            font-size: 2.6rem; 
            background: #333; 
            padding: 20px 50px; 
            border-radius: 10px; 
            width: 80%; 
            box-sizing: border-box; 
            border-left: 5px solid #e50914;
        }

        /* ஸ்நாக்ஸ் அறிவிப்பு */
        .upcoming-alert { 
            display: none; 
            width: 90%; 
            margin-top: 20px;
            z-index: 2;
        }
        .alert-title { 
            font-size: 2.5rem; 
            font-weight: bold; 
            color: #ffcc00; 
            margin-bottom: 20px; 
            animation: pulse 1s infinite alternate; 
        }
        .alert-desc { 
            font-size: 1.8rem; 
            color: #e0e0e0; 
            line-height: 1.5; 
            background: #222; 
            padding: 25px; 
            border-radius: 10px; 
            border-left: 5px solid #ffcc00; 
        }
        @keyframes pulse { 
            from { transform: scale(1); } 
            to { transform: scale(1.02); } 
        }
    </style>
</head>
<body>

    <header>
        <div class="cinema-name">BLOCKBUSTER CINEPLEXES</div>
        <div class="live-clock-container">
            <div class="live-time" id="liveTime">00:00:00 AM</div>
            <div class="live-date" id="liveDate">LOADING DATE...</div>
        </div>
    </header>
    
    <div class="main">
        <div class="poster-panel">
            <img src="poster1.jpeg" alt="Logo" id="mainPoster">
        </div>
        
        <div class="info-panel" id="infoPanel">
            <div class="video-container" id="videoContainer">
                <video id="promoVideo" autoplay muted playsinline preload="auto" webkit-playsinline></video>
            </div>

            <div class="now-seating" id="seatingBadge">NOW SEATING</div>
            <div class="hall-container" id="hallList"></div>

            <div class="upcoming-alert" id="upcomingAlert">
                <div class="alert-title">NOW SEATING STARTS SHORTLY</div>
                <div class="alert-desc">Beat the queue—grab your snacks and drinks now for the perfect movie experience!</div>
            </div>
        </div>
    </div>

    <script>
        const videoList = ['video1.mp4', 'video2.mp4', 'video3.mp4'];
        let videoIndex = 0;
        const promoVideo = document.getElementById('promoVideo');

        function playNextVideo() {
            if (videoList.length > 0) {
                promoVideo.muted = true;
                promoVideo.src = videoList[videoIndex];
                promoVideo.load(); // TV Buffer ஆகாமல் இருக்க Load கட்டளை சேர்க்கப்பட்டுள்ளது
                
                var playPromise = promoVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function(error) {
                        console.log("Autoplay error:", error);
                    });
                }
                videoIndex = (videoIndex + 1) % videoList.length;
            }
        }

        promoVideo.addEventListener('ended', playNextVideo);

        window.addEventListener('load', function() {
            playNextVideo();
        });

        const schedules = [
            { hour: 11, minute: 45, duration: 20, halls: ['Hall 2', 'Hall 3', 'Hall 5'] },
            { hour: 14, minute: 45, duration: 20, halls: ['Hall 5'] },
            { hour: 14, minute: 55, duration: 20, halls: ['Hall 2'] },
            { hour: 15, minute: 5,  duration: 20, halls: ['Hall 3'] },
            { hour: 17, minute: 45, duration: 20, halls: ['Hall 5'] },
            { hour: 17, minute: 55, duration: 20, halls: ['Hall 2'] },
            { hour: 18, minute: 20, duration: 20, halls: ['Hall 3'] },
            { hour: 20, minute: 45, duration: 20, halls: ['Hall 5'] },
            { hour: 21, minute: 0,  duration: 20, halls: ['Hall 1', 'Hall 2'] },
            { hour: 21, minute: 15, duration: 20, halls: ['Hall 3'] },
            { hour: 23, minute: 55, duration: 20, halls: ['Hall 3'] },
            { hour: 0,  minute: 0,  duration: 20, halls: ['Hall 5'] }
        ];

        function updateDisplay() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', options);

            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTotalMinutes = (currentHour * 60) + currentMinute;

            let activeHalls = [];
            let isUpcomingActive = false;

            schedules.forEach(schedule => {
                const showTotalMinutes = (schedule.hour * 60) + schedule.minute;
                const endTotalMinutes = showTotalMinutes + schedule.duration;
                const upcomingStartMinutes = showTotalMinutes - 10; 

                if (currentTotalMinutes >= showTotalMinutes && currentTotalMinutes < endTotalMinutes) {
                    activeHalls = activeHalls.concat(schedule.halls);
                }
                if (currentTotalMinutes >= upcomingStartMinutes && currentTotalMinutes < showTotalMinutes) {
                    isUpcomingActive = true;
                }
            });

            const uniqueHalls = [...new Set(activeHalls)];

            const seatingBadge = document.getElementById('seatingBadge');
            const hallList = document.getElementById('hallList');
            const upcomingAlert = document.getElementById('upcomingAlert');
            const videoContainer = document.getElementById('videoContainer');

            if (uniqueHalls.length > 0) {
                videoContainer.style.display = 'none';
                promoVideo.pause();

                seatingBadge.style.display = 'block';
                hallList.style.display = 'flex';
                upcomingAlert.style.display = 'none';

                hallList.innerHTML = ''; 
                uniqueHalls.forEach(hall => {
                    const hallDiv = document.createElement('div');
                    hallDiv.className = 'hall';
                    hallDiv.innerText = hall.toUpperCase();
                    hallList.appendChild(hallDiv);
                });
            } else if (isUpcomingActive) {
                videoContainer.style.display = 'none';
                promoVideo.pause();

                seatingBadge.style.display = 'none';
                hallList.style.display = 'none';
                upcomingAlert.style.display = 'block';
            } else {
                seatingBadge.style.display = 'none';
                hallList.style.display = 'none';
                upcomingAlert.style.display = 'none';

                if (videoContainer.style.display === 'none' || videoContainer.style.display === '') {
                    videoContainer.style.display = 'block';
                    promoVideo.muted = true;
                    promoVideo.play().catch(e => console.log("Play error:", e));
                }
            }
        }

        updateDisplay();
        setInterval(updateDisplay, 5000); 

        setInterval(function() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            document.getElementById('liveTime').innerText = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
        }, 1000);
    </script>
</body>
</html>
